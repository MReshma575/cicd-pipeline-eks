name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # the deploy job commits the updated image tag back to the repo
  packages: write   # push the image to GHCR

env:
  IMAGE: ghcr.io/mreshma575/cicd-demo-app

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -v

  build-and-push:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (tagged with the commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  update-manifest:
    name: Update Kubernetes manifest (GitOps hand-off)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the Deployment at the new image tag
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          sed -i "s|value: \"latest\"|value: \"${GITHUB_SHA}\"|" k8s/deployment.yaml
      - name: Commit the manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy ${GITHUB_SHA} [skip ci]" || echo "No manifest change"
          git push
      # Argo CD (see the globomantics-gitops repo) watches this repo and syncs the
      # cluster to the new tag — that is the continuous-delivery half of the loop.
